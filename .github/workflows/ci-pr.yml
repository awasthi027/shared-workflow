name: Shared work flow

on:
  workflow_call:
    inputs:
      config_path:
        description: 'Path for json config file'
        required: true
        type: string
      repository:
        description: 'The owner and repository name.'
        required: false
        type: string
        default: ${{ github.repository }}
      ref:
        description: 'The fully-formed ref of the branch or tag that triggered the workflow run'
        required: false
        type: string
        default: ${{ github.ref }}
    outputs:
      config:
        description: 'Music Sheet Configuration'
        value: ${{ inputs.config_path }}

permissions:
  contents: read

jobs:
  prepare:
     name: '🌱 Seed Workflow Config 🌱'
     runs-on: macos-26
     outputs:
      matrix: ${{ steps.readjson.outputs.config-content }}
     steps:

      - name: Checkout Project Repository
        uses: actions/checkout@main
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Build Configuration
        id: readjson
        uses: awasthi027/validate-workflow-config-action@v1
        with: 
          config-path: ${{ inputs.config_path }}
  build:
    name: '🔍 ${{ matrix.build.name }} [🍎]'
    runs-on: ${{ matrix.common.runs-on }}
    needs: [prepare]
    strategy:
        fail-fast: false
        matrix: 
          build: ${{ fromJson(needs.prepare.outputs.matrix).build }}
          common: ${{ fromJson(needs.prepare.outputs.matrix).common }}

    steps:
      - name: Checkout Project Repository
        uses: actions/checkout@main
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Run Pre-Script
        if: ${{ !matrix.build.disabled && matrix.build.prescript != '' }}
        shell: bash
        run: |
          echo "Running pre-script: ${{ matrix.build.prescript }}"
          chmod +x "${{ matrix.build.prescript }}"
          "${{ matrix.build.prescript }}"
          
      - name: ${{ matrix.build.name }}
        if: ${{ !matrix.build.disabled }}
        uses: awasthi027/fastlane-action@v4
        with:
           working_repo: ${{ matrix.build.fastlane.working_repo }}
           fastlane_repo: ${{ matrix.build.fastlane.fastlane_repo }}
           lane_name: ${{ matrix.build.fastlane.lane  }}
           env_name: ${{ matrix.build.fastlane.env  }}
           gitPATToken: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: '🧪 ${{ matrix.test.name }} [💻]'
    runs-on: ${{ matrix.common.runs-on }}
    needs: [prepare, build]
    strategy:
        fail-fast: false
        matrix: 
          test: ${{ fromJson(needs.prepare.outputs.matrix).test }}
          common: ${{ fromJson(needs.prepare.outputs.matrix).common }}

    steps:
      - name: Checkout Project Repository
        uses: actions/checkout@main
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Run Pre-Script
        if: ${{ !matrix.test.disabled && matrix.test.prescript != '' }}
        shell: bash
        run: |
          echo "Running pre-script: ${{ matrix.test.prescript }}"
          chmod +x "${{ matrix.test.prescript }}"
          "${{ matrix.test.prescript }}"
          
      - name: ${{ matrix.test.name }}
        if: ${{ !matrix.test.disabled }}
        uses: awasthi027/fastlane-action@v4
        with:
           working_repo: ${{ matrix.test.fastlane.working_repo }}
           fastlane_repo: ${{ matrix.test.fastlane.fastlane_repo }}
           lane_name: ${{ matrix.test.fastlane.lane  }}
           env_name: ${{ matrix.test.fastlane.env  }}
           gitPATToken: ${{ secrets.GITHUB_TOKEN }}          
          
      - name: Collect Test Results
        if: ${{ always() && !matrix.test.disabled }}
        shell: bash
        run: |
          DEST="$GITHUB_WORKSPACE/test-results/${{ matrix.test.name }}"
          mkdir -p "$DEST"
          # Copy .xcresult bundles produced by the test run from DerivedData
          find "$HOME/Library/Developer/Xcode/DerivedData" \
               -type d -name '*.xcresult' -exec cp -R {} "$DEST/" \; 2>/dev/null || true
          # Also copy any fastlane scan output if the lane generated it
          find "$GITHUB_WORKSPACE" -type d \( -iname 'test_output' -o -iname 'reports' \) \
               -exec cp -R {} "$DEST/" \; 2>/dev/null || true
          echo "Collected results in $DEST:"
          ls -la "$DEST" || true

      - name: Upload Test Results
        if: ${{ always() && !matrix.test.disabled }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.test.name }}
          path: test-results/${{ matrix.test.name }}/**
          retention-days: 14
          if-no-files-found: warn

      - name: Fail if tests failed
        if: ${{ steps.run_tests.outcome == 'failure' }}
        run: |
          echo "::error::Tests failed for ${{ matrix.test.name }}"
          exit 1          
          
